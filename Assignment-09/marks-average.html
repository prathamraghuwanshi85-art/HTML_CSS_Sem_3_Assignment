<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Class Average Marks</title>
</head>
<body>
  <table border="1">
    <caption>Marks of Class A</caption>
    <thead>
      <tr>
        <th>Name</th>
        <th>Maths</th>
        <th>Science</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Asha</td>
        <td>78</td>
        <td>85</td>
      </tr>
      <tr>
        <td>Rohan</td>
        <td>64</td>
        <td>70</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <th>Class average</th>
        <td>71</td>
        <td>77.5</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
