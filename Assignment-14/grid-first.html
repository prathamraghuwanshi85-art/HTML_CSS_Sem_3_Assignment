<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Equal Columns CSS Grid</title>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      max-width: 600px;
    }
    .grid-box {
      background-color: #457b9d;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h2>3-Column Equal Grid (fr units)</h2>
  <div class="grid-container">
    <div class="grid-box">1</div>
    <div class="grid-box">2</div>
    <div class="grid-box">3</div>
    <div class="grid-box">4</div>
    <div class="grid-box">5</div>
    <div class="grid-box">6</div>
  </div>
</body>
</html>
