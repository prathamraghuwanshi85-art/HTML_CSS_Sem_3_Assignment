<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Units Demonstration</title>
  <style>
    .fixed-box {
      width: 200px;
      height: 40px;
      background-color: #457b9d;
      margin-bottom: 12px;
      color: white;
      line-height: 40px;
      text-align: center;
    }
    .percent-box {
      width: 50%;
      height: 40px;
      background-color: #2a9d8f;
      margin-bottom: 12px;
      color: white;
      line-height: 40px;
      text-align: center;
    }
    .rem-text {
      font-size: 1.5rem;
      color: #1d3557;
    }
  </style>
</head>
<body>
  <h2>CSS Units (px, %, rem)</h2>
  <div class="fixed-box">200px Fixed Box</div>
  <div class="percent-box">50% Responsive Box</div>
  <p class="rem-text">This paragraph is styled with a 1.5rem font size.</p>
</body>
</html>
