<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox Navigation Bar</title>
  <style>
    nav {
      display: flex;
      background-color: #1d3557;
      padding: 14px 20px;
      gap: 24px;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-weight: bold;
    }
    nav a:hover {
      color: #e63946;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#events">Events</a>
    <a href="#contact">Contact</a>
  </nav>
</body>
</html>
